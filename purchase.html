<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ</title>
<link rel="stylesheet" href="css/purchase.css">
</head>

<body>

<div class="home-wrapper">
    <a href="index.html" class="home-link">
        ▹ 戻る
    </a>
</div>

<div class="page-title">

    <h1>お問い合わせ</h1>

    <p class="page-sub">
        ミニアート・作品集・ラボ・クリエナ占術・光の鑑定書に関する<br>
        ご質問やご相談を承っております。<br>
        静かな光の流れの中で、ひとつずつ丁寧にお返事いたします。
    </p>

</div>

<div class="purchase-form-wrapper">

    <form action="#" method="post" class="purchase-form">

        <label>お名前</label>
        <input type="text" name="name" required>

        <label>メールアドレス</label>
        <input type="email" name="email" required>

        <label>お問い合わせ内容</label>

        <select name="category">

            <option value="">選択してください</option>

            <option>ミニアートについて</option>

            <option>作品集について</option>

            <option>ラボについて</option>

            <option>クリエナ占術について</option>

            <option>光の鑑定書について</option>

            <option>その他</option>

        </select>

        <label>メッセージ</label>

        <textarea
            name="message"
            rows="8"
            placeholder="ご質問・ご相談内容をご記入ください。"></textarea>

        <button type="submit" class="submit-btn">
            送信する
        </button>

    </form>

</div>

<footer>

<p class="footer-copy">
Copyright © 2026 Criena. All Rights Reserved.
</p>

</footer>

</body>
</html>
