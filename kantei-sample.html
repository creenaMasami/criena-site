<!DOCTYPE html>
<html lang="ja">

<title>光の鑑定書 サンプル</title>
<link rel="stylesheet" href="css/kantei-sample.css">
</head>

<body>

<div class="home-wrapper">
    <a href="light-book.html" class="home-link">
        ▹ 戻る
    </a>
</div>

<div class="sample-wrap">

    <h1 class="sample-title">
        光の鑑定書
    </h1>

    <p class="sample-lead">
        あなたの意識から生まれる物語を、<br>
        ほんの少しだけご紹介します。
    </p>

    <div class="sample-divider"></div>

    <div class="sample-gallery">

        <div class="sample-item">
            <img src="image/sample01.jpg" alt="表紙">
        </div>

        <div class="sample-item">
            <img src="image/sample02.jpg" alt="目次">
        </div>

        <div class="sample-item">
            <img src="image/sample03.jpg" alt="序章">
        </div>

    </div>

    <div class="sample-message">

        <p>
            ページをめくるたびに、
        </p>

        <p>
            まだ言葉になっていない感覚や記憶に<br>
            そっと触れていく。
        </p>

        <p>
            光の鑑定書は、<br>
            あなた自身の物語を静かに読み解くために<br>
            生まれました。
        </p>

    </div>

</div>
